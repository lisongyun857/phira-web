<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phira 玩家面板">
  <meta name="format-detection" content="telephone=no">
  <title>Phira 玩家面板</title>
  <link rel="preconnect" href="https://phira.5wyxi.com" crossorigin>
  <link rel="dns-prefetch" href="https://phira.5wyxi.com">
  <link rel="stylesheet" href="assets/styles.css?v=4">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span class="brand-text">
        <strong id="site-name">Phira 管理面板</strong>
        <span class="brand-sub">玩家面板</span>
      </span>
    </div>
    <div class="topbar-actions">
      <span class="user-chip" id="user-chip" hidden>
        <span class="avatar" id="user-avatar" aria-hidden="true">?</span>
        <span class="user-name" id="user-name"></span>
      </span>
      <button class="btn btn-ghost btn-sm" id="btn-logout" type="button" hidden>退出</button>
    </div>
  </header>

  <main class="page">
    <!-- 未登录：Phira 账号登录 -->
    <section class="auth-wrap" id="login-view">
      <form class="card auth-card" id="login-form" novalidate>
        <div class="card-head">
          <div>
            <h2>登录玩家面板</h2>
            <p class="muted">使用 Phira 官方邮箱与密码登录，用于查看并操作你所在的房间。</p>
          </div>
        </div>
        <div class="card-body">
          <label class="field" for="login-email">
            <span>Phira 邮箱</span>
            <input class="input" id="login-email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
          </label>
          <label class="field" for="login-password">
            <span>密码</span>
            <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Phira 账号密码" required>
          </label>
          <p class="form-error" id="login-error" hidden></p>
          <button class="btn btn-primary btn-block" id="login-submit" type="submit">登录</button>
          <p class="hint">密码仅发送到你所配置的服务器，由服务器转发给 Phira 官方验证，本页面不会保存密码。会话有效期约 7 天。</p>
        </div>
      </form>
    </section>

    <!-- 已登录 -->
    <div id="app-view" hidden>
      <div class="toolbar">
        <div class="toolbar-info">
          <span class="sync-status" id="sync-status">尚未同步</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-refresh" type="button">刷新</button>
      </div>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>我的房间</h2>
            <p class="muted">房间操作需要 Phira 账号在线，并且已进入该房间。</p>
          </div>
        </div>
        <div class="card-body" id="my-room"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>在线房间</h2>
            <p class="muted">隐藏房间不会显示在列表中，点击“详情”可查看成员。</p>
          </div>
        </div>
        <div class="card-body">
          <div class="table-wrap" id="rooms-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>房间</th>
                  <th>人数</th>
                  <th>谱面</th>
                  <th>阶段</th>
                  <th>状态</th>
                  <th>房主</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="rooms-body"></tbody>
            </table>
          </div>
          <div class="empty" id="rooms-empty" hidden>当前没有在线房间。</div>
        </div>
      </section>

      <section class="card" id="room-detail-card" hidden>
        <div class="card-head">
          <div>
            <h2>房间详情</h2>
            <p class="muted" id="room-detail-sub">只读视图</p>
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-close-detail" type="button">关闭</button>
        </div>
        <div class="card-body" id="room-detail"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2>账号</h2>
            <p class="muted">QQ 绑定用于在群聊中通过指令控制房间。</p>
          </div>
        </div>
        <div class="card-body" id="account"></div>
      </section>
    </div>
  </main>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="config.js?v=4" defer></script>
  <script src="assets/mobile.js?v=4" defer></script>
  <script src="assets/chart-picker.js?v=4" defer></script>
  <script src="assets/app.js?v=4" defer></script>
</body>
</html>
